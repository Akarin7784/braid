name: CI
on: [push, pull_request]
env:
  PYTHONWARNDEFAULTENCODING: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: 检查 pre-commit 钩子（存在且可执行）
        run: |
          for f in scripts/hooks/pre-commit scripts/install-hooks.sh; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            [ "$mode" = "100755" ] || { echo "$f 不存在或没有执行权限（git 里的 mode 是 '${mode:-无}'）"; exit 1; }
          done
          bash -n scripts/hooks/pre-commit
  test-and-package:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: pyinstaller --noconfirm packaging/braid.spec
      - name: 检查包内资源（tokens、QSS、图标）
        shell: bash
        run: |
          for f in tokens.json app_light.qss app_dark.qss; do
            find dist -name "$f" | grep -q . || { echo "缺少 $f"; exit 1; }
          done
          for d in icons shadows; do
            n=$(find dist -path "*braid/assets/$d/*.png" | wc -l)
            [ "$n" -ge 6 ] || { echo "assets/$d 只有 $n 张 png，应至少 6 张"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: braid-${{ runner.os }}
          path: dist/

  ui-xvfb:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 fonts-noto-cjk
      - run: pip install -e ".[dev]"
      - name: 在 xcb 上跑界面测试
        env: {QT_QPA_PLATFORM: xcb}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pytest -v
      - name: 截设计走查图
        env: {QT_QPA_PLATFORM: xcb}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python benchmarks/shots.py shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots/
