name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONWARNDEFAULTENCODING: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: 检查 pre-commit 钩子（存在且可执行）
        run: |
          for f in scripts/hooks/pre-commit scripts/install-hooks.sh; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            [ "$mode" = "100755" ] || { echo "$f 不存在或没有执行权限（git 里的 mode 是 '${mode:-无}'）"; exit 1; }
          done
          bash -n scripts/hooks/pre-commit
      - name: 检查 wheel 里的资源
        run: |
          pip wheel --no-deps -w wheel_dist .
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("wheel_dist/braid-*.whl")[0]).namelist()
          need = {"braid/theme/tokens.json", "braid/theme/app_light.qss", "braid/theme/app_dark.qss"}
          need |= {f"braid/assets/fonts/{f}" for f in ("Inter-Regular.ttf", "Inter-SemiBold.ttf", "OFL.txt")}
          miss = need - set(names)
          for d in ("icons", "shadows"):
              n = sum(1 for x in names if x.startswith(f"braid/assets/{d}/") and x.endswith(".png"))
              if n < 6:
                  miss.add(f"braid/assets/{d}/*.png（只有 {n} 张）")
          for k in ("back", "forward", "reload", "stop", "external"):
              for m in ("light", "dark"):
                  f = f"braid/assets/icons/nav_{k}_{m}.png"
                  if f not in names:
                      miss.add(f)
          for k in ("open", "closed"):
              for m in ("light", "dark"):
                  f = f"braid/assets/icons/eye_{k}_{m}.png"
                  if f not in names:
                      miss.add(f)
          assert not miss, f"wheel 缺少: {sorted(miss)}"
          print("wheel 资源齐全")
          PY
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.p.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: p
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # main 上、带 full-ci 标签、或改了平台布局相关路径时才跑三平台，否则只跑 Ubuntu
          full=0
          if [ "$EVENT" != pull_request ] || [[ " $LABELS " == *" full-ci "* ]]; then full=1
          elif git diff --name-only "$BASE" HEAD | grep -qE 'main_window|panel|theme/|packaging/|pyproject.toml|\.github/'; then full=1; fi
          if [ $full = 1 ]; then echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"; fi
  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: 字体回落报告（mac/win 用原生平台插件）
        if: runner.os != 'Linux'
        shell: bash
        env: {QT_QPA_PLATFORM: ""}
        run: python benchmarks/fonts.py fonts-${{ runner.os }}.txt
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: fonts-${{ runner.os }}
          path: fonts-${{ runner.os }}.txt
          if-no-files-found: ignore

  package:
    # PR 上也跑：打包产物自检是发版门槛，必须合入前就验证
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows 控制台是 cp1252，中文输出会 UnicodeEncodeError
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pyinstaller --noconfirm packaging/braid.spec
      - name: 检查包内资源（tokens、QSS、图标、字体）
        shell: bash
        run: |
          for f in tokens.json app_light.qss app_dark.qss; do
            find dist -name "$f" | grep -q . || { echo "缺少 $f"; exit 1; }
          done
          for f in Inter-Regular.ttf Inter-SemiBold.ttf OFL.txt; do
            find dist -path "*braid/assets/fonts/$f" | grep -q . || { echo "缺少 assets/fonts/$f"; exit 1; }
          done
          for d in icons shadows; do
            n=$(find dist -path "*braid/assets/$d/*.png" | wc -l)
            [ "$n" -ge 6 ] || { echo "assets/$d 只有 $n 张 png，应至少 6 张"; exit 1; }
          done
          miss=0
          for k in back forward reload stop external; do
            for m in light dark; do
              find dist -path "*braid/assets/icons/nav_${k}_${m}.png" | grep -q . || { echo "缺少 nav_${k}_${m}.png"; miss=1; }
            done
          done
          for k in open closed; do
            for m in light dark; do
              find dist -path "*braid/assets/icons/eye_${k}_${m}.png" | grep -q . || { echo "缺少 eye_${k}_${m}.png"; miss=1; }
            done
          done
          [ "$miss" -eq 0 ]
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - name: 打包产物自检（keyring 后端 + WebEngine）
        shell: bash
        env: {QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"}
        run: |
          out="$PWD/selfcheck-${{ runner.os }}.txt"
          case "${{ runner.os }}" in
            Linux)   QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x800x24" dist/braid/braid --self-check "$out" ;;
            Windows) QT_QPA_PLATFORM=windows dist/braid/braid.exe --self-check "$out" ;;
            macOS)   QT_QPA_PLATFORM=cocoa dist/Braid.app/Contents/MacOS/braid --self-check "$out" ;;
          esac
          rc=$?
          cat "$out" || echo "自检没有写出结果文件"
          exit $rc
      - name: 发版归档 + 体积报告（Linux tar.gz / mac dmg 保留符号链接，Windows zip）
        id: pack
        shell: bash
        run: |
          f=$(python packaging/package_report.py archive "${{ runner.os }}" | tail -n 1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          # 体积与重复文件写进 size-<OS>.txt，并并入 selfcheck-<OS>.txt 的 package 字段；超线只告警
          python packaging/package_report.py report "${{ runner.os }}" "$f"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-${{ runner.os }}.txt
          path: size-${{ runner.os }}.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-${{ runner.os }}.txt
          path: selfcheck-${{ runner.os }}.txt
          if-no-files-found: warn
      - name: 打包冷启动计时（只告警，不拦）
        continue-on-error: true
        shell: bash
        env: {QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"}
        run: |
          out="$PWD/startup-${{ runner.os }}.txt"; : > "$out"
          case "${{ runner.os }}" in
            Linux)   run() { QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x800x24" dist/braid/braid --startup-time "$1"; } ;;
            Windows) run() { QT_QPA_PLATFORM=windows dist/braid/braid.exe --startup-time "$1"; } ;;
            macOS)   run() { QT_QPA_PLATFORM=cocoa dist/Braid.app/Contents/MacOS/braid --startup-time "$1"; } ;;
          esac
          for i in 1 2 3; do
            s=$(python -c "import time; print(time.time())")
            run "run-$i.json" || echo "::warning::第 $i 次启动退出码 $?"
            e=$(python -c "import time; print(time.time())")
            python - "$i" "$s" "$e" "run-$i.json" >> "$out" <<'PY'
          import json, sys
          i, s, e, f = sys.argv[1], float(sys.argv[2]), float(sys.argv[3]), sys.argv[4]
          try:
              d = json.load(open(f, encoding="utf-8"))
          except Exception as ex:
              d = {"error": repr(ex)}
          d["run"] = int(i); d["cold"] = i == "1"; d["wall_ms"] = round((e - s) * 1000, 1)
          print(json.dumps(d, ensure_ascii=False))
          PY
          done
          python - "$out" <<'PY'
          import json, statistics, sys
          rows = [json.loads(l) for l in open(sys.argv[1], encoding="utf-8") if l.strip()]
          warm = [r for r in rows if not r["cold"] and "first_paint_ms" in r]
          summ = {"summary": True,
                  "cold_first_paint_ms": rows[0].get("first_paint_ms"), "cold_wall_ms": rows[0].get("wall_ms"),
                  "warm_median_first_paint_ms": statistics.median(r["first_paint_ms"] for r in warm) if warm else None,
                  "warm_median_wall_ms": statistics.median(r["wall_ms"] for r in warm) if warm else None}
          open(sys.argv[1], "a", encoding="utf-8").write(json.dumps(summ, ensure_ascii=False) + "\n")
          print(summ)
          print(f"::notice::冷启动 首帧 {summ['cold_first_paint_ms']}ms / 墙钟 {summ['cold_wall_ms']}ms；热启动中位数 首帧 {summ['warm_median_first_paint_ms']}ms / 墙钟 {summ['warm_median_wall_ms']}ms")
          PY
          cat "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: startup-${{ runner.os }}.txt
          path: startup-${{ runner.os }}.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          # 上传的就是 release 要挂的文件；别再传 dist/，upload-artifact 会把符号链接展开成重复文件
          name: braid-${{ runner.os }}
          path: ${{ steps.pack.outputs.file }}
          compression-level: 0

  ui-xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 fonts-noto-cjk fonts-noto-cjk-extra && fc-list :lang=zh family style | sort
      - run: pip install -e ".[dev]"
      - name: 在 xcb 上跑界面测试
        env: {QT_QPA_PLATFORM: xcb}
        run: |
          # main 上连跑 5 轮找偶发失败，PR 上只跑 1 轮
          n=1; [ "${{ github.event_name }}" = push ] && n=5
          for i in $(seq $n); do
            echo "== 第 $i 轮 =="
            xvfb-run -a -s "-screen 0 1600x1000x24" pytest -q -p no:cacheprovider --junitxml=junit-$i.xml || exit 1
          done
          echo "== 1.5 倍缩放 =="
          QT_SCALE_FACTOR=1.5 xvfb-run -a -s "-screen 0 1600x1000x24" pytest -q -p no:cacheprovider || exit 1
      - name: 截设计走查图
        env: {QT_QPA_PLATFORM: xcb}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python benchmarks/shots.py shots
      - name: 字体回落报告（xcb）
        env: {QT_QPA_PLATFORM: xcb}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python benchmarks/fonts.py fonts-Linux.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fonts-Linux
          path: fonts-Linux.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots/

  webengine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 fonts-noto-cjk
      - run: pip install -e ".[dev]"
      - name: 浏览器相关测试
        env: {QT_QPA_PLATFORM: xcb, QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox"}
        run: |
          # 还没有 webengine 测试时 pytest 退出码是 5（没选中测试），不算失败
          xvfb-run -a -s "-screen 0 1600x1000x24" pytest -v -m webengine || [ $? -eq 5 ]
      - name: 冷启动门槛（不得加载 WebEngine，且 ≤1.5s）
        env: {QT_QPA_PLATFORM: offscreen}
        run: |
          python -c "import sys; import braid.ui.main_window; assert not any(m.startswith('PySide6.QtWebEngine') for m in sys.modules), 'main_window 启动时加载了 WebEngine'"
          pytest -v tests/test_startup_bench.py
