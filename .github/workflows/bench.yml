name: Bench
on:
  push:
    branches: [main]
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - run: pip install -e ".[dev]" psutil
      # 取 main 上最近一次的结果作基线（PR 时）
      - if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: bench.yml
          branch: main
          name: bench-${{ runner.os }}
          path: baseline
      - name: Run benchmarks（暂时只提示不拦截）
        continue-on-error: true
        run: python benchmarks/run_bench.py --out bench.json --baseline baseline/bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ runner.os }}
          path: bench.json
