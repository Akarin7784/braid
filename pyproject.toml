[project]
name = "braid"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "Pygments>=2.17"]
[project.scripts]
braid = "braid.app:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"braid.theme" = ["*.qss"]
"braid.assets" = ["*.png", "*.svg"]
"braid.assets.shadows" = ["*.png"]
"braid.assets.icons" = ["*.png"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.10"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["braid"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["benchmark: 启动时间基准"]
